
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#123b63">
<title>R R A M Billing</title>

<style>
* { box-sizing: border-box; }

body {
  font-family: Arial, sans-serif;
  background: #f1f4c8;
  margin: 0;
  color: #172524;
}

header {
  background: #123b63;
  color: orange;
  padding: 20px;
  text-align: center;
}

main {
  max-width: 700px;
  margin: 20px auto;
  padding: 12px;
}

.card {
  background: gray;
  padding: 18px;
  border-radius: 16px;
  margin-bottom: 22px;
  box-shadow: 0 2px 10px #0016;
}

h2 { font-size: 19px; }

label {
  display: block;
  margin-top: 12px;
  font-weight: bold;
}

input {
  width: 100%;
  padding: 12px;
  margin-top: 5px;
  border: 1px solid #ccc;
  border-radius: 15px;
  font-size: 16px;
}

button {
  padding: 12px 16px;
  margin: 6px 3px;
  border: 0;
  border-radius: 7px;
  background: #1769aa;
  color: white;
  font-size: 15px;
  cursor: pointer;
}

.secondary {
  background: #e5edf5;
  color: #123b63;
}

.bill {
  border: 4px solid #ddd;
  padding: 12px;
  border-radius: 8px;
  margin-top: 12px;
  overflow-wrap: anywhere;
}

.total {
  font-size: 21px;
  font-weight: bold;
  color: #123b63;
}

#loginScreen {
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 20px;
}

.loginCard {
  background: white;
  width: 100%;
  max-width: 380px;
  padding: 25px;
  border-radius: 18px;
  box-shadow: 0 4px 18px #0003;
  text-align: center;
}

.loginCard h1 { color: #123b63; }

.loginCard button {
  width: 100%;
  background: #123b63;
}

#loginError { color: red; }

#app { display: none; }

.logoutBtn { background: #a52b2b; }

#locationStatus {
  overflow-wrap: anywhere;
}
</style>
</head>

<body>

<!-- LOGIN -->
<div id="loginScreen">
  <div class="loginCard">
    <h1>R R A M</h1>
    <h2>Admin Login</h2>

    <form id="loginForm">
      <label>Username</label>
      <input id="loginUsername"
        placeholder="Enter username"
        autocomplete="username" required>

      <label>Password</label>
      <input id="loginPassword"
        type="password"
        placeholder="Enter password"
        autocomplete="current-password" required>

      <button type="submit">LOGIN</button>
      <p id="loginError"></p>
    </form>
  </div>
</div>

<!-- MAIN APP -->
<div id="app">

<header>
  <h1>R R A M @ Bill Book</h1>
  <p>Customer & Field Billing Management</p>
  <button class="logoutBtn" onclick="logoutUser()">LOGOUT</button>
</header>

<main>

<div class="card">
<h2>Customer Details</h2>

<form id="billForm">

<label>Customer Name</label>
<input id="name" required placeholder="Enter customer name">

<label>Phone Number</label>
<input id="phone" required type="tel" placeholder="Enter phone number">

<label>Village</label>
<input id="village" placeholder="Enter village">

<label>Work Type / Field Entry</label>
<input id="work" placeholder="Enter work details">

<label>Unit</label>
<input id="unit" placeholder="Acre / Hour / Other">

<label>Quantity</label>
<input id="qty" type="number" min="0" step="any" value="1">

<label>Rate (₹)</label>
<input id="rate" type="number" min="0" step="any" value="0">

<label>Advance (₹)</label>
<input id="advance" type="number" min="0" step="any" value="0">

<label>Current Location</label>
<button type="button" id="locationBtn">
Get Current Location
</button>

<p id="locationStatus">Location not selected</p>
<input type="hidden" id="location">

<p>Total Amount:</p>
<div class="total" id="total">₹0.00</div>

<p id="balance">Balance: ₹0.00</p>

<button type="submit" id="saveBtn">SAVE BILL</button>
<button type="reset" class="secondary">CLEAR</button>

</form>
</div>

<div class="card">
<h2>Saved Bills</h2>

<button id="exportBtn" class="secondary">
Export CSV
</button>

<div id="billList">No bills yet.</div>
</div>

</main>
</div>

<script>

// LOGIN DETAILS
const USERNAME = "admin";
const PASSWORD = "password";

// STORAGE
const KEY = "rram_billing_bills_v1";

const $ = id => document.getElementById(id);

let bills = [];

try {
  bills = JSON.parse(localStorage.getItem(KEY) || "[]");
  if (!Array.isArray(bills)) bills = [];
} catch(e) {
  bills = [];
}

let editingBillId = null;

// LOGIN
$("loginForm").onsubmit = function(e) {
  e.preventDefault();

  const user = $("loginUsername").value.trim();
  const pass = $("loginPassword").value;

  if (user === USERNAME && pass === PASSWORD) {
    sessionStorage.setItem("rram_logged_in", "yes");
    showApp();
  } else {
    $("loginError").textContent =
      "Wrong Username or Password";
  }
};

function showApp() {
  $("loginScreen").style.display = "none";
  $("app").style.display = "block";
  calculate();
  displayBills();
}

function logoutUser() {
  sessionStorage.removeItem("rram_logged_in");

  $("app").style.display = "none";
  $("loginScreen").style.display = "flex";
  $("loginPassword").value = "";
  $("loginError").textContent = "";
}

// AUTO LOGIN FOR CURRENT TAB SESSION
if (sessionStorage.getItem("rram_logged_in") === "yes") {
  showApp();
}

// MONEY
function money(n) {
  return "₹" + Number(n || 0).toFixed(2);
}

// CALCULATION
function calculate() {
  let qty = Number($("qty").value) || 0;
  let rate = Number($("rate").value) || 0;
  let advance = Number($("advance").value) || 0;

  let total = qty * rate;

  $("total").textContent = money(total);
  $("balance").textContent =
    "Balance: " + money(total - advance);
}

["qty", "rate", "advance"].forEach(id => {
  $(id).addEventListener("input", calculate);
});

// GPS LOCATION
$("locationBtn").onclick = function() {

  if (!navigator.geolocation) {
    $("locationStatus").textContent =
      "GPS not supported";
    return;
  }

  $("locationStatus").textContent =
    "Getting location...";

  navigator.geolocation.getCurrentPosition(
    position => {

      let lat = position.coords.latitude;
      let lng = position.coords.longitude;

      $("location").value = lat + "," + lng;

      $("locationStatus").textContent =
        "Location captured: " + lat + ", " + lng;
    },

    error => {
      $("locationStatus").textContent =
        "Location unavailable. Allow GPS permission.";
    },

    {
      enableHighAccuracy: true,
      timeout: 20000,
      maximumAge: 0
    }
  );
};

// SAVE DATA
function saveData() {
  try {
    localStorage.setItem(KEY, JSON.stringify(bills));
    displayBills();
  } catch(e) {
    alert("Storage error. Please check device storage.");
  }
}

// DISPLAY BILLS
function displayBills() {

  let box = $("billList");
  box.innerHTML = "";

  if (!bills.length) {
    box.textContent = "No bills yet.";
    return;
  }

  [...bills].reverse().forEach(b => {

    let div = document.createElement("div");
    div.className = "bill";

    let title = document.createElement("h3");
    title.textContent = b.name + " - " + money(b.total);
    div.appendChild(title);

    let details = document.createElement("p");

    details.textContent =
      "Phone: " + b.phone +
      " | Village: " + b.village +
      " | Work: " + b.work +
      " | Unit: " + b.unit;

    div.appendChild(details);

    let amount = document.createElement("p");

    amount.textContent =
      "Quantity: " + b.qty +
      " | Rate: " + money(b.rate) +
      " | Total: " + money(b.total) +
      " | Advance: " + money(b.advance) +
      " | Balance: " + money(b.balance);

    div.appendChild(amount);

    // WHATSAPP
    let wa = document.createElement("button");

    wa.textContent = "🟢 SEND WHATSAPP";
    wa.style.background = "#128C7E";

    wa.onclick = function() {

      let phone = (b.phone || "").replace(/\D/g, "");

      if (phone.length === 10) {
        phone = "91" + phone;
      }

      if (phone.length !== 12 || !phone.startsWith("91")) {
        alert("Enter valid Indian mobile number");
        return;
      }

      let message =
        "R R A M BILL BOOK\n\n" +
        "Customer: " + b.name + "\n" +
        "Phone: " + b.phone + "\n" +
        "Village: " + b.village + "\n" +
        "Work: " + b.work + "\n" +
        "Unit: " + b.unit + "\n" +
        "Quantity: " + b.qty + "\n" +
        "Rate: " + money(b.rate) + "\n" +
        "Total: " + money(b.total) + "\n" +
        "Advance: " + money(b.advance) + "\n" +
        "Balance: " + money(b.balance) + "\n\n" +
        "Thank You!";

      window.open(
        "https://wa.me/" + phone +
        "?text=" + encodeURIComponent(message),
        "_blank"
      );
    };

    div.appendChild(wa);

    // LOCATION
    let location = document.createElement("p");

    location.textContent =
      "Location: " + (b.location || "Not captured");

    div.appendChild(location);

    // EDIT
    let edit = document.createElement("button");

    edit.textContent = "✏️ EDIT";
    edit.style.background = "#00804a";

    edit.onclick = function() {

      editingBillId = b.id;

      $("name").value = b.name || "";
      $("phone").value = b.phone || "";
      $("village").value = b.village || "";
      $("work").value = b.work || "";
      $("unit").value = b.unit || "";
      $("qty").value = b.qty ?? 1;
      $("rate").value = b.rate ?? 0;
      $("advance").value = b.advance ?? 0;
      $("location").value = b.location || "";

      $("locationStatus").textContent =
        b.location ? "Saved location: " + b.location :
        "Location not selected";

      $("saveBtn").textContent = "UPDATE BILL";

      calculate();

      $("billForm").scrollIntoView({
        behavior: "smooth"
      });
    };

    div.appendChild(edit);

    // DELETE
    let del = document.createElement("button");

    del.textContent = "DELETE";
    del.style.background = "#a52b2b";

    del.onclick = function() {

      if (confirm("Delete this bill?")) {

        bills = bills.filter(x => x.id !== b.id);

        saveData();
      }
    };

    div.appendChild(del);

    box.appendChild(div);
  });
}

// SAVE / UPDATE
$("billForm").onsubmit = function(e) {

  e.preventDefault();

  let qty = Number($("qty").value) || 0;
  let rate = Number($("rate").value) || 0;
  let advance = Number($("advance").value) || 0;

  let total = qty * rate;

  if (advance > total) {
    alert("Advance cannot exceed total amount");
    return;
  }

  let bill = {

    id: editingBillId !== null ?
      editingBillId : Date.now(),

    name: $("name").value.trim(),
    phone: $("phone").value.trim(),
    village: $("village").value.trim(),
    work: $("work").value.trim(),
    unit: $("unit").value.trim(),

    qty,
    rate,
    total,
    advance,

    balance: total - advance,

    location: $("location").value,

    createdAt: editingBillId !== null ?
      (bills.find(b => b.id === editingBillId)?.createdAt ||
      new Date().toISOString()) :
      new Date().toISOString()
  };

  if (editingBillId !== null) {

    let index = bills.findIndex(
      b => b.id === editingBillId
    );

    if (index === -1) {
      alert("Bill not found");
      return;
    }

    bills[index] = bill;

    alert("Bill Updated Successfully!");

  } else {

    bills.push(bill);

    alert("Bill Saved Successfully!");
  }

  editingBillId = null;

  saveData();

  this.reset();

  $("qty").value = 1;
  $("rate").value = 0;
  $("advance").value = 0;
  $("location").value = "";

  $("locationStatus").textContent =
    "Location not selected";

  $("saveBtn").textContent = "SAVE BILL";

  calculate();
};

// CLEAR / CANCEL EDIT
$("billForm").addEventListener("reset", function() {

  editingBillId = null;

  $("saveBtn").textContent = "SAVE BILL";

});

// EXPORT CSV
$("exportBtn").onclick = function() {

  if (!bills.length) {
    alert("No bills to export");
    return;
  }

  let columns = [
    "name",
    "phone",
    "village",
    "work",
    "unit",
    "qty",
    "rate",
    "total",
    "advance",
    "balance",
    "location",
    "createdAt"
  ];

  let csv = [
    columns.join(","),

    ...bills.map(b =>
      columns.map(k =>
        '"' + String(b[k] ?? "").replace(/"/g, '""') + '"'
      ).join(",")
    )

  ].join("\n");

  let blob = new Blob(
    ["\ufeff" + csv],
    { type: "text/csv;charset=utf-8" }
  );

  let url = URL.createObjectURL(blob);

  let a = document.createElement("a");

  a.href = url;
  a.download = "RRAM-Bills.csv";

  document.body.appendChild(a);
  a.click();
  a.remove();

  URL.revokeObjectURL(url);
};

// INITIAL CALCULATION
calculate();

</script>

</body>
</html>
