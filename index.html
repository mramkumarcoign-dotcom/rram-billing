
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#123b63">
<title>R R A M Billing</title>

<style>
*{box-sizing:border-box}
body{font-family:Arial;background:#f1f4c8;margin:0;color:#172524}
header{background:#123b63;color:orange;padding:20px;text-align:center}
main{max-width:700px;margin:20px auto;padding:12px}
.card{background:gray;padding:18px;border-radius:16px;margin-bottom:22px;box-shadow:0 2px 10px #0016}
h2{font-size:19px}
label{display:block;margin-top:12px;font-weight:bold}
input,select{width:100%;padding:12px;margin-top:5px;border:1px solid #ccc;border-radius:15px;font-size:16px}
button{padding:12px 16px;margin:6px 3px;border:0;border-radius:7px;background:#1769aa;color:white;font-size:15px;cursor:pointer}
button:disabled{opacity:.6}
.secondary{background:#e5edf5;color:#123b63}
.bill{border:4px solid #ddd;padding:12px;border-radius:8px;margin-top:12px;overflow-wrap:anywhere;background:#eee}
.total{font-size:21px;font-weight:bold;color:#123b63}
#loginScreen{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.loginCard{background:white;width:100%;max-width:380px;padding:25px;border-radius:18px;box-shadow:0 4px 18px #0003;text-align:center}
.loginCard h1{color:#123b63}
.loginCard button{width:100%;background:#123b63}
#loginError{color:red}
#app{display:none}
.logoutBtn{background:#a52b2b}
#locationStatus{overflow-wrap:anywhere}
.authLink{color:#1769aa;cursor:pointer;text-decoration:underline}
#authMessage{overflow-wrap:anywhere}
.otherField{display:none}
</style>
</head>

<body>

<div id="loginScreen">
 <div class="loginCard">
  <h1>R R A M</h1>
  <h2 id="authTitle">Email Login</h2>

  <form id="authForm">
   <div id="nameField" style="display:none">
    <label>Your Name</label>
    <input id="signupName" placeholder="Enter your name">
   </div>

   <label>Email Address</label>
   <input id="email" type="email" placeholder="Enter email" required>

   <label>Password</label>
   <input id="password" type="password" placeholder="Enter password" minlength="6" required>

   <div id="confirmField" style="display:none">
    <label>Confirm Password</label>
    <input id="confirmPassword" type="password" placeholder="Confirm password">
   </div>

   <button type="submit" id="authButton">LOGIN</button>
  </form>

  <p id="authMessage"></p>

  <p id="signupText">
   New user? <span class="authLink" id="showSignup">Sign Up</span>
  </p>

  <p id="loginText" style="display:none">
   Already registered? <span class="authLink" id="showLogin">Login</span>
  </p>

  <p><span class="authLink" id="forgotPassword">Forgot Password?</span></p>
 </div>
</div>

<div id="app">

<header>
 <h1>R R A M @ Bill Book</h1>
 <p>Customer & Field Billing Management</p>
 <p id="userEmail"></p>
 <button class="logoutBtn" id="logoutBtn">LOGOUT</button>
</header>

<main>

<div class="card">
<h2>Customer Details</h2>

<form id="billForm">

<label>Customer Name</label>
<input id="name" required placeholder="Enter customer name">

<label>Phone Number</label>
<input id="phone" required type="tel" placeholder="Enter phone number">

<label>Village</label>
<input id="village" placeholder="Enter village">

<label>Work Type</label>
<select id="work">
 <option value="">Select Work Type</option>
 <option value="Harvester">Harvester</option>
 <option value="Baler">Baler</option>
 <option value="Tractor">Tractor</option>
 <option value="JCB">JCB</option>
 <option value="Excavator">Excavator</option>
 <option value="Land Mover">Land Mover</option>
 <option value="Other">Other</option>
</select>
<input id="workOther" class="otherField" placeholder="Enter other work type">

<label>Unit</label>
<select id="unit">
 <option value="">Select Unit</option>
 <option value="Hours">Hours</option>
 <option value="Acre">Acre</option>
 <option value="Bales">Bales</option>
 <option value="Foot">Foot</option>
 <option value="Meter">Meter</option>
 <option value="Quintal">Quintal</option>
 <option value="KG">KG</option>
 <option value="Other">Other</option>
</select>
<input id="unitOther" class="otherField" placeholder="Enter other unit">

<label>Quantity</label>
<input id="qty" type="number" min="0" step="any" value="1">

<label>Rate (₹)</label>
<input id="rate" type="number" min="0" step="any" value="0">

<label>Advance (₹)</label>
<input id="advance" type="number" min="0" step="any" value="0">

<label>Current Location</label>
<button type="button" id="locationBtn">Get Current Location</button>
<p id="locationStatus">Location not selected</p>
<input type="hidden" id="location">

<p>Total Amount:</p>
<div class="total" id="total">₹0.00</div>
<p id="balance">Balance: ₹0.00</p>

<button type="submit" id="saveBtn">SAVE BILL</button>
<button type="reset" class="secondary">CLEAR</button>

</form>
</div>

<div class="card">
<h2>Saved Bills</h2>
<button id="exportBtn" class="secondary">Export CSV</button>
<div id="billList">Loading bills...</div>
</div>

</main>
</div>

<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";

import {
 getAuth,
 createUserWithEmailAndPassword,
 signInWithEmailAndPassword,
 sendEmailVerification,
 sendPasswordResetEmail,
 signOut,
 onAuthStateChanged,
 updateProfile
}
from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";

import {
 getFirestore,
 collection,
 addDoc,
 updateDoc,
 deleteDoc,
 doc,
 onSnapshot,
 query,
 orderBy
}
from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";

// IMPORTANT: Replace these with your actual Firebase Web App details.

const firebaseConfig = {
 apiKey: "YOUR_API_KEY",
 authDomain: "YOUR_PROJECT.firebaseapp.com",
 projectId: "YOUR_PROJECT_ID",
 storageBucket: "YOUR_PROJECT.firebasestorage.app",
 messagingSenderId: "YOUR_SENDER_ID",
 appId: "YOUR_APP_ID"
};

const firebaseApp = initializeApp(firebaseConfig);
const auth = getAuth(firebaseApp);
const db = getFirestore(firebaseApp);

const $ = id => document.getElementById(id);

let currentUser = null;
let bills = [];
let editingBillId = null;
let unsubscribeBills = null;
let authMode = "login";

const billsCollection = () =>
 collection(db,"users",currentUser.uid,"bills");

// OTHER FIELDS

function updateOtherFields(){
 $("workOther").style.display =
  $("work").value==="Other"?"block":"none";

 $("unitOther").style.display =
  $("unit").value==="Other"?"block":"none";
}

$("work").addEventListener("change",updateOtherFields);
$("unit").addEventListener("change",updateOtherFields);

function getChoiceValue(selectId,otherId){
 const selected=$(selectId).value;
 return selected==="Other"
  ?$(otherId).value.trim()
  :selected;
}

function setChoiceValue(selectId,otherId,value){
 const select=$(selectId);
 const other=$(otherId);
 const saved=value||"";

 const exists=Array.from(select.options)
  .some(o=>o.value===saved);

 if(exists){
  select.value=saved;
  other.value="";
 }else if(saved){
  select.value="Other";
  other.value=saved;
 }else{
  select.value="";
  other.value="";
 }
 updateOtherFields();
}

// AUTH MODE

function setAuthMode(mode){
 authMode=mode;

 $("authMessage").textContent="";
 $("authTitle").textContent=
  mode==="signup"?"Create New Account":"Email Login";

 $("authButton").textContent=
  mode==="signup"?"SIGN UP":"LOGIN";

 $("nameField").style.display=
  mode==="signup"?"block":"none";

 $("confirmField").style.display=
  mode==="signup"?"block":"none";

 $("signupText").style.display=
  mode==="login"?"block":"none";

 $("loginText").style.display=
  mode==="signup"?"block":"none";
}

$("showSignup").onclick=()=>setAuthMode("signup");
$("showLogin").onclick=()=>setAuthMode("login");

// SIGN UP / LOGIN

$("authForm").onsubmit=async e=>{
 e.preventDefault();

 const email=$("email").value.trim();
 const password=$("password").value;

 $("authButton").disabled=true;
 $("authMessage").textContent="Please wait...";

 try{
  if(authMode==="signup"){
   const name=$("signupName").value.trim();
   const confirmPassword=$("confirmPassword").value;

   if(!name) throw new Error("Enter your name");
   if(password!==confirmPassword)
    throw new Error("Passwords do not match");

   const credential=
    await createUserWithEmailAndPassword(auth,email,password);

   await updateProfile(credential.user,{displayName:name});

   try{
    await sendEmailVerification(credential.user);
    $("authMessage").textContent=
     "Account created! Verification email sent.";
   }catch(error){
    console.error(error);
   }
  }else{
   await signInWithEmailAndPassword(auth,email,password);
  }
 }catch(error){
  $("authMessage").textContent=
   error.code==="auth/email-already-in-use"
   ?"This email is already registered."
   :error.code==="auth/invalid-credential"
   ?"Incorrect email or password."
   :error.code==="auth/weak-password"
   ?"Password must contain at least 6 characters."
   :error.message;
 }finally{
  $("authButton").disabled=false;
 }
};

// FORGOT PASSWORD

$("forgotPassword").onclick=async()=>{
 const email=$("email").value.trim();

 if(!email){
  alert("Please enter your email address first.");
  return;
 }

 try{
  await sendPasswordResetEmail(auth,email);
  alert("Password reset link sent to your email.");
 }catch(error){
  alert(error.message);
 }
};

// AUTH STATE

onAuthStateChanged(auth,user=>{
 if(unsubscribeBills){
  unsubscribeBills();
  unsubscribeBills=null;
 }

 if(user){
  currentUser=user;
  showApp();
 }else{
  currentUser=null;
  bills=[];
  $("app").style.display="none";
  $("loginScreen").style.display="flex";
  setAuthMode("login");
 }
});

function showApp(){
 $("loginScreen").style.display="none";
 $("app").style.display="block";
 $("userEmail").textContent="Logged in: "+currentUser.email;
 calculate();
 loadBills();
}

$("logoutBtn").onclick=async()=>{
 if(confirm("Are you sure you want to logout?")){
  await signOut(auth);
 }
};

// MONEY AND CALCULATION

function money(n){
 return "₹"+Number(n||0).toFixed(2);
}

function calculate(){
 const qty=Number($("qty").value)||0;
 const rate=Number($("rate").value)||0;
 const advance=Number($("advance").value)||0;
 const total=qty*rate;

 $("total").textContent=money(total);
 $("balance").textContent="Balance: "+money(total-advance);
}

["qty","rate","advance"].forEach(id=>{
 $(id).addEventListener("input",calculate);
});

// GPS LOCATION

$("locationBtn").onclick=()=>{
 if(!navigator.geolocation){
  $("locationStatus").textContent="GPS not supported";
  return;
 }

 $("locationStatus").textContent="Getting location...";

 navigator.geolocation.getCurrentPosition(
  position=>{
   const lat=position.coords.latitude;
   const lng=position.coords.longitude;

   $("location").value=lat+","+lng;
   $("locationStatus").textContent=
    "Location captured: "+lat+", "+lng;
  },
  error=>{
   $("locationStatus").textContent=
    "Location unavailable. Allow GPS permission.";
  },
  {
   enableHighAccuracy:true,
   timeout:20000,
   maximumAge:0
  }
 );
};

// LOAD BILLS

function loadBills(){
 $("billList").textContent="Loading bills...";

 const q=query(
  billsCollection(),
  orderBy("createdAt","desc")
 );

 unsubscribeBills=onSnapshot(q,snapshot=>{
  bills=snapshot.docs.map(d=>({
   id:d.id,
   ...d.data()
  }));
  displayBills();
 },error=>{
  $("billList").textContent=
   "Unable to load bills: "+error.message;
 });
}

// SAVE / UPDATE CLOUD DATA

async function saveBillData(bill){
 if(editingBillId){
  await updateDoc(
   doc(db,"users",currentUser.uid,"bills",editingBillId),
   bill
  );
 }else{
  await addDoc(billsCollection(),bill);
 }
}

// DISPLAY SAVED BILLS

function displayBills(){
 const box=$("billList");
 box.innerHTML="";

 if(!bills.length){
  box.textContent="No bills yet.";
  return;
 }

 bills.forEach(b=>{
  const div=document.createElement("div");
  div.className="bill";

  const title=document.createElement("h3");
  title.textContent=b.name+" - "+money(b.total);
  div.appendChild(title);

  const details=document.createElement("p");
  details.textContent=
   "Phone: "+b.phone+
   " | Village: "+b.village+
   " | Work: "+b.work+
   " | Unit: "+b.unit;
  div.appendChild(details);

  const amount=document.createElement("p");
  amount.textContent=
   "Quantity: "+b.qty+
   " | Rate: "+money(b.rate)+
   " | Total: "+money(b.total)+
   " | Advance: "+money(b.advance)+
   " | Balance: "+money(b.balance);
  div.appendChild(amount);

  // CALL CUSTOMER

  const call=document.createElement("button");
  call.textContent="📞 CALL CUSTOMER";
  call.style.background="#00804a";

  call.onclick=()=>{
   const phone=(b.phone||"").replace(/\D/g,"");
   if(phone.length<10){
    alert("Invalid phone number");
    return;
   }
   window.location.href="tel:"+phone;
  };
  div.appendChild(call);

  // WHATSAPP

  const wa=document.createElement("button");
  wa.textContent="🟢 SEND WHATSAPP";
  wa.style.background="#128C7E";

  wa.onclick=()=>{
   let phone=(b.phone||"").replace(/\D/g,"");

   if(phone.length===10) phone="91"+phone;

   if(phone.length!==12||!phone.startsWith("91")){
    alert("Enter valid Indian mobile number");
    return;
   }

   const message=
    "R R A M BILL BOOK\n\n"+
    "Customer: "+b.name+"\n"+
    "Phone: "+b.phone+"\n"+
    "Village: "+b.village+"\n"+
    "Work: "+b.work+"\n"+
    "Unit: "+b.unit+"\n"+
    "Quantity: "+b.qty+"\n"+
    "Rate: "+money(b.rate)+"\n"+
    "Total: "+money(b.total)+"\n"+
    "Advance: "+money(b.advance)+"\n"+
    "Balance: "+money(b.balance)+"\n\nThank You!";

   window.open(
    "https://wa.me/"+phone+
    "?text="+encodeURIComponent(message),
    "_blank"
   );
  };
  div.appendChild(wa);

  const loc=document.createElement("p");
  loc.textContent="Location: "+(b.location||"Not captured");
  div.appendChild(loc);

  // EDIT BUTTON

  const edit=document.createElement("button");
  edit.textContent="✏️ EDIT";
  edit.style.background="#00804a";

  edit.onclick=()=>{
   editingBillId=b.id;

   $("name").value=b.name||"";
   $("phone").value=b.phone||"";
   $("village").value=b.village||"";

   setChoiceValue("work","workOther",b.work);
   setChoiceValue("unit","unitOther",b.unit);

   $("qty").value=b.qty??1;
   $("rate").value=b.rate??0;
   $("advance").value=b.advance??0;
   $("location").value=b.location||"";

   $("locationStatus").textContent=
    b.location?"Saved location: "+b.location:
    "Location not selected";

   $("saveBtn").textContent="UPDATE BILL";
   calculate();
   $("billForm").scrollIntoView({behavior:"smooth"});
  };
  div.appendChild(edit);

  // DELETE BUTTON

  const del=document.createElement("button");
  del.textContent="🗑️ DELETE";
  del.style.background="#a52b2b";

  del.onclick=async()=>{
   if(!confirm("Are you sure you want to delete this bill?"))return;

   try{
    await deleteDoc(
     doc(db,"users",currentUser.uid,"bills",b.id)
    );

    if(editingBillId===b.id){
     $("billForm").reset();
    }

    alert("Bill deleted successfully!");
   }catch(error){
    alert("Delete failed: "+error.message);
   }
  };
  div.appendChild(del);

  box.appendChild(div);
 });
}

// SAVE / UPDATE BILL

$("billForm").onsubmit=async function(e){
 e.preventDefault();

 const qty=Number($("qty").value)||0;
 const rate=Number($("rate").value)||0;
 const advance=Number($("advance").value)||0;
 const total=qty*rate;

 const workValue=getChoiceValue("work","workOther");
 const unitValue=getChoiceValue("unit","unitOther");

 if(!workValue){
  alert("Please select Work Type");
  return;
 }

 if(!unitValue){
  alert("Please select Unit");
  return;
 }

 if(advance>total){
  alert("Advance cannot exceed total amount");
  return;
 }

 const oldBill=bills.find(b=>b.id===editingBillId);

 const bill={
  name:$("name").value.trim(),
  phone:$("phone").value.trim(),
  village:$("village").value.trim(),
  work:workValue,
  unit:unitValue,
  qty,
  rate,
  total,
  advance,
  balance:total-advance,
  location:$("location").value,
  createdAt:oldBill?.createdAt||new Date().toISOString()
 };

 $("saveBtn").disabled=true;

 try{
  await saveBillData(bill);

  alert(editingBillId?
   "Bill Updated Successfully!":
   "Bill Saved Successfully!");

  editingBillId=null;
  this.reset();

  $("qty").value=1;
  $("rate").value=0;
  $("advance").value=0;
  $("location").value="";
  $("workOther").value="";
  $("unitOther").value="";

  updateOtherFields();

  $("locationStatus").textContent="Location not selected";
  $("saveBtn").textContent="SAVE BILL";
  calculate();

 }catch(error){
  alert("Save failed: "+error.message);
 }finally{
  $("saveBtn").disabled=false;
 }
};

// CLEAR / CANCEL EDIT

$("billForm").addEventListener("reset",()=>{
 editingBillId=null;
 $("saveBtn").textContent="SAVE BILL";

 setTimeout(()=>{
  $("workOther").value="";
  $("unitOther").value="";
  updateOtherFields();
  calculate();
 },0);
});

// EXPORT CSV

$("exportBtn").onclick=()=>{
 if(!bills.length){
  alert("No bills to export");
  return;
 }

 const columns=[
  "name","phone","village","work","unit",
  "qty","rate","total","advance","balance",
  "location","createdAt"
 ];

 const csv=[
  columns.join(","),
  ...bills.map(b=>
   columns.map(k=>
    '"'+String(b[k]??"").replace(/"/g,'""')+'"'
   ).join(",")
  )
 ].join("\n");

 const blob=new Blob(
  ["\ufeff"+csv],
  {type:"text/csv;charset=utf-8"}
 );

 const url=URL.createObjectURL(blob);
 const a=document.createElement("a");

 a.href=url;
 a.download="RRAM-Bills.csv";
 document.body.appendChild(a);
 a.click();
 a.remove();

 URL.revokeObjectURL(url);
};

calculate();
updateOtherFields();

</script>
</body>
</html>
